<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فیلتر مخاطبین VCF</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --text:#1f2430; --muted:#6b7280; --accent:#2563eb; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161c; --card:#1d2029; --text:#e8eaf0; --muted:#9aa1b0; --accent:#5b8def; --border:#2c303c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Tahoma, "Segoe UI", sans-serif; padding:24px 12px; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:1.3rem; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
  .drop { border:2px dashed var(--border); border-radius:12px; padding:32px 12px; text-align:center; cursor:pointer; color:var(--muted); }
  .drop.over { border-color:var(--accent); color:var(--accent); }
  input[type=file] { display:none; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .stat { flex:1; min-width:140px; background:var(--bg); border-radius:10px; padding:12px; text-align:center; }
  .stat b { display:block; font-size:1.4rem; }
  .stat span { color:var(--muted); font-size:.85rem; }
  button { font:inherit; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; cursor:pointer; }
  button.alt { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .actions { display:flex; gap:10px; flex-wrap:wrap; }
  ul { list-style:none; margin:14px 0 0; padding:0; max-height:300px; overflow-y:auto; border-top:1px solid var(--border); }
  li { border-bottom:1px solid var(--border); font-size:.92rem; }
  li label { display:flex; align-items:center; gap:10px; padding:8px 2px; cursor:pointer; }
  li label span { flex:1; }
  li input, .toolbar input { width:18px; height:18px; accent-color:var(--accent); cursor:pointer; }
  .toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px; padding:8px 2px; font-size:.92rem; }
  .toolbar label { display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:bold; }
  .toolbar .count { color:var(--muted); font-weight:normal; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  li small { color:var(--muted); direction:ltr; unicode-bidi:embed; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>فیلتر مخاطبین VCF (فقط مخاطبین دارای شماره)</h1>

  <div class="card">
    <label class="drop" id="drop">
      فایل <b>.vcf</b> را اینجا بکشید یا کلیک کنید
      <input type="file" id="file" accept=".vcf,text/vcard,text/x-vcard">
    </label>
  </div>

  <div class="card hidden" id="result">
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>کل مخاطبین</span></div>
      <div class="stat"><b id="sWith">0</b><span>دارای شماره</span></div>
      <div class="stat"><b id="sWithout">0</b><span>بدون شماره</span></div>
    </div>
    <div class="actions">
      <button id="dlVcf">دانلود VCF</button>
      <button id="dlTxt" class="alt">دانلود TXT</button>
    </div>
    <div class="toolbar">
      <label><input type="checkbox" id="selAll" checked> انتخاب همه</label>
      <span class="count">انتخاب‌شده: <b id="selCount">0</b></span>
    </div>
    <ul id="list"></ul>
  </div>
</div>

<script>
let keptBlocks = [];   // متن اصلی کارت‌های دارای TEL
let keptInfo = [];     // {name, phones}

// دیکود Quoted-Printable (UTF-8)
function decodeQP(str) {
  const bytes = [];
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    if (c === '=' && /^[0-9A-Fa-f]{2}$/.test(str.substr(i + 1, 2))) {
      bytes.push(parseInt(str.substr(i + 1, 2), 16));
      i += 2;
    } else {
      const enc = new TextEncoder().encode(c);
      bytes.push(...enc);
    }
  }
  return new TextDecoder('utf-8').decode(new Uint8Array(bytes));
}

// خواندن مقدار یک خط (با دیکود در صورت نیاز)
function lineValue(line) {
  const idx = line.indexOf(':');
  if (idx === -1) return '';
  const params = line.slice(0, idx);
  let val = line.slice(idx + 1);
  if (/ENCODING=QUOTED-PRINTABLE/i.test(params)) val = decodeQP(val);
  return val.trim();
}

function parseVcf(text) {
  const blocks = text.match(/BEGIN:VCARD[\s\S]*?END:VCARD/gi) || [];
  const kept = [], info = [];

  for (const block of blocks) {
    // باز کردن خطوط شکسته‌ی QP (= در انتهای خط)
    const unfolded = block.replace(/=\r?\n/g, '');
    const lines = unfolded.split(/\r?\n/);

    const phones = [];
    let name = '';
    for (const line of lines) {
      if (/^TEL[;:]/i.test(line)) {
        const idx = line.indexOf(':');
        const v = idx === -1 ? '' : line.slice(idx + 1).trim();
        if (v) phones.push(v);
      } else if (/^FN[;:]/i.test(line)) {
        name = lineValue(line);
      }
    }
    if (!name) {
      const nLine = lines.find(l => /^N[;:]/i.test(l));
      if (nLine) name = lineValue(nLine).split(';').filter(Boolean).reverse().join(' ');
    }

    if (phones.length) {
      kept.push(block.trim());
      info.push({ name: name || '(بدون نام)', phones: [...new Set(phones)] });
    }
  }
  return { total: blocks.length, kept, info };
}

function download(filename, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const { total, kept, info } = parseVcf(reader.result);
    keptBlocks = kept;
    keptInfo = info;
    document.getElementById('sTotal').textContent = total;
    document.getElementById('sWith').textContent = kept.length;
    document.getElementById('sWithout').textContent = total - kept.length;

    const list = document.getElementById('list');
    list.innerHTML = '';
    info.forEach((c, i) => {
      const li = document.createElement('li');
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      cb.dataset.index = i;
      cb.addEventListener('change', updateSelection);
      const n = document.createElement('span');
      n.textContent = c.name;
      const p = document.createElement('small');
      p.textContent = c.phones.join(' ، ');
      label.append(cb, n, p);
      li.appendChild(label);
      list.appendChild(li);
    });
    updateSelection();
    document.getElementById('result').classList.remove('hidden');
  };
  reader.readAsText(file, 'utf-8');
}

const fileInput = document.getElementById('file');
const drop = document.getElementById('drop');
fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));

function selectedIndexes() {
  return [...document.querySelectorAll('#list input[type=checkbox]')]
    .filter(cb => cb.checked).map(cb => +cb.dataset.index);
}

function updateSelection() {
  const boxes = [...document.querySelectorAll('#list input[type=checkbox]')];
  const n = boxes.filter(cb => cb.checked).length;
  document.getElementById('selCount').textContent = n;
  const all = document.getElementById('selAll');
  all.checked = boxes.length > 0 && n === boxes.length;
  all.indeterminate = n > 0 && n < boxes.length;
  document.getElementById('dlVcf').disabled = n === 0;
  document.getElementById('dlTxt').disabled = n === 0;
}

document.getElementById('selAll').addEventListener('change', e => {
  document.querySelectorAll('#list input[type=checkbox]').forEach(cb => cb.checked = e.target.checked);
  updateSelection();
});

document.getElementById('dlVcf').addEventListener('click', () => {
  const sel = selectedIndexes().map(i => keptBlocks[i]);
  download('contacts-selected.vcf', sel.join('\r\n') + '\r\n', 'text/vcard;charset=utf-8');
});
document.getElementById('dlTxt').addEventListener('click', () => {
  const txt = selectedIndexes().map(i => keptInfo[i]).map(c => c.name + ' : ' + c.phones.join(' , ')).join('\n');
  download('contacts-selected.txt', '\uFEFF' + txt, 'text/plain;charset=utf-8');
});
</script>
</body>
</html>
